<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Saanvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deepest: #061f15;
    --forest-deep: #0a3324;
    --forest-mid: #123f2c;
    --forest-line: #1e5c3f;
    --gold: #d9b46a;
    --gold-bright: #ecd08f;
    --rose: #c98a8a;
    --cream: #f4ecd8;
    --cream-dim: #cfc6ac;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background: var(--forest-deepest);
    color: var(--cream);
    font-family:'Jost', sans-serif;
    overflow:hidden;
  }

  #stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, var(--forest-mid) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 110%, #0d4a32 0%, transparent 45%),
      linear-gradient(180deg, var(--forest-deep) 0%, var(--forest-deepest) 100%);
  }

  /* ---------- texture: soft vignette + faint dotted stars ---------- */
  #stage::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(217,180,106,0.12) 1px, transparent 1.4px);
    background-size: 34px 34px;
    opacity:0.35;
    pointer-events:none;
  }
  #stage::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 160px 40px rgba(0,0,0,0.55);
    pointer-events:none;
  }

  /* ---------- balloons ---------- */
  .balloon-field{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .balloon{
    position:absolute;
    bottom:-220px;
    width:64px;
    opacity:0.9;
    animation: rise linear infinite;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
  }
  .balloon svg{ width:100%; display:block; }
  .balloon .string{
    stroke: rgba(244,236,216,0.35);
    stroke-width:1.4;
    fill:none;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(-4deg); }
    50%{ transform: translateY(-58vh) translateX(24px) rotate(4deg); }
    100%{ transform: translateY(-118vh) translateX(-10px) rotate(-3deg); }
  }

  /* ---------- panels ---------- */
  .panel{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    opacity:0;
    visibility:hidden;
    transition: opacity .7s ease;
  }
  .panel.active{ opacity:1; visibility:visible; }

  /* ---------- landing ---------- */
  #landing .inner{
    text-align:center;
    padding: 0 24px;
  }
  .eyebrow-mark{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-bottom:18px;
    color: var(--gold);
    letter-spacing: 0.28em;
    font-size: 12px;
    text-transform: uppercase;
    opacity:0.85;
  }
  .eyebrow-mark::before, .eyebrow-mark::after{
    content:"";
    width:34px; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .eyebrow-mark::after{ background: linear-gradient(90deg, var(--gold), transparent); }

  .script{
    font-family:'Parisienne', cursive;
    color: var(--gold-bright);
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height:1;
    display:block;
    margin-bottom: 6px;
  }
  .display-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(3.2rem, 12vw, 7.5rem);
    line-height:0.95;
    letter-spacing: 0.01em;
    color: var(--cream);
    text-shadow: 0 2px 30px rgba(217,180,106,0.15);
  }
  .landing-sub{
    margin-top:22px;
    font-weight:300;
    letter-spacing:0.05em;
    color: var(--cream-dim);
    font-size: 15px;
  }

  .btn{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.08em;
    color: var(--forest-deepest);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:none;
    padding: 15px 46px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 26px rgba(217,180,106,0.28);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(217,180,106,0.38); }
  .btn:active{ transform: translateY(0px) scale(0.98); }
  .btn:focus-visible{ outline: 2px solid var(--cream); outline-offset:3px; }

  #start-btn{ margin-top:38px; }

  /* ---------- slideshow ---------- */
  #slideshow .inner{
    width:100%;
    max-width: 560px;
    padding: 0 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .frame{
    position:relative;
    width: min(88vw, 400px);
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow:hidden;
    border: 1px solid var(--forest-line);
    background: linear-gradient(160deg, var(--forest-mid), var(--forest-deep));
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    border: 1px solid rgba(217,180,106,0.25);
    border-radius:18px;
    margin:8px;
    pointer-events:none;
    z-index:3;
  }
  .frame img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .frame .fallback{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    text-align:center;
    padding: 20px;
  }
  .fallback svg{ width:56px; height:56px; opacity:0.85; }
  .fallback span{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--cream-dim);
  }

  .count{
    margin-top:16px;
    font-size:12px;
    letter-spacing:0.22em;
    color: var(--gold);
    text-transform:uppercase;
  }

  .message{
    margin-top:16px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(1.15rem, 3.4vw, 1.55rem);
    line-height:1.4;
    color: var(--cream);
    text-align:center;
    min-height: 3.6em;
    display:flex; align-items:center; justify-content:center;
  }

  .nav-row{
    margin-top: 20px;
    display:flex;
    align-items:center;
    gap: 22px;
  }
  .nav-btn{
    width:46px; height:46px;
    border-radius:50%;
    border: 1px solid var(--forest-line);
    background: rgba(255,255,255,0.02);
    color: var(--gold-bright);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .nav-btn:hover{ border-color: var(--gold); background: rgba(217,180,106,0.08); transform: translateY(-1px); }
  .nav-btn:active{ transform: translateY(0) scale(0.95); }
  .nav-btn:disabled{ opacity:0.25; cursor:default; transform:none; }
  .nav-btn:focus-visible{ outline: 2px solid var(--cream); outline-offset:3px; }

  .dots{
    display:flex; gap:6px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--forest-line);
    transition: background .2s ease, transform .2s ease;
  }
  .dot.on{ background: var(--gold); transform: scale(1.3); }

  /* ---------- collage panel ---------- */
  #collage .inner{
    width:100%;
    max-width: 720px;
    padding: 40px 24px;
    text-align:center;
    max-height: 92vh;
    overflow-y:auto;
  }
  .collage-title{
    font-family:'Parisienne', cursive;
    color: var(--gold-bright);
    font-size: clamp(2rem, 6vw, 2.8rem);
    margin-bottom:4px;
  }
  .collage-sub{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color: var(--cream-dim);
    font-size: 16px;
    margin-bottom: 26px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:8px;
  }
  .grid .cell{
    position:relative;
    aspect-ratio: 1;
    border-radius:8px;
    overflow:hidden;
    border: 1px solid var(--forest-line);
    background: linear-gradient(160deg, var(--forest-mid), var(--forest-deep));
  }
  .grid .cell:nth-child(5n+1){ grid-column: span 2; grid-row: span 2; }
  .grid img{ width:100%; height:100%; object-fit:cover; display:block; }
  .grid .fallback svg{ width:26px; height:26px; }
  .grid .cell:nth-child(5n+1) .fallback svg{ width:40px; height:40px; }

  .closing{
    margin-top: 30px;
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    line-height:1.55;
    color: var(--cream);
  }
  .replay{ margin-top:26px; }

  @media (max-width: 420px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
    .grid .cell:nth-child(5n+1){ grid-column: span 2; grid-row: span 2; }
  }

  @media (prefers-reduced-motion: reduce){
    .balloon{ animation: none; display:none; }
    .panel{ transition: none; }
  }
</style>
</head>
<body>

<div id="stage">

  <div class="balloon-field" id="balloonField"></div>

  <!-- LANDING -->
  <section class="panel active" id="landing">
    <div class="inner">
      <span class="eyebrow-mark">A little celebration</span>
      <span class="script">Happy Birthday</span>
      <h1 class="display-name">Saanvi</h1>
      <p class="landing-sub">ha ha chal chal zyada khush matt ho</p>
      <button class="btn" id="start-btn">Start</button>
    </div>
  </section>

  <!-- SLIDESHOW -->
  <section class="panel" id="slideshow">
    <div class="inner">
      <div class="frame">
        <img id="slide-img" src="" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="fallback" id="slide-fallback"></div>
      </div>
      <div class="count" id="slide-count">01 / 15</div>
      <p class="message" id="slide-message"></p>
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn" aria-label="Previous">&#8592;</button>
        <div class="dots" id="dots"></div>
        <button class="nav-btn" id="next-btn" aria-label="Next">&#8594;</button>
      </div>
    </div>
  </section>

  <!-- COLLAGE -->
  <section class="panel" id="collage">
    <div class="inner">
      <div class="collage-title">All of us, together</div>
      <div class="collage-sub">ha ha chal chal, stop smiling</div>
      <div class="grid" id="collage-grid"></div>
      <p class="closing">Here's to another year of you &mdash; wishing you a birthday as wonderful and one-of-a-kind as you are, Saanvi. &#127881;</p>
      <button class="btn replay" id="replay-btn">Watch again</button>
    </div>
  </section>

</div>

<script>
(function(){

  /* ---------------- content ---------------- */
  // Drop your own photos into an "images" folder next to this file,
  // named 1.jpg, 2.jpg ... 13.jpg — they'll appear automatically.
  // Until then, a soft themed placeholder is shown.
  var messages = [
    "Birthday Gurlll in her natural element", //Solo
    "Brothers from Different Mothers", //Shardul
    "INCSD310804 assigned to you: Goan Case", //Reiine
    "We look better in person, I promise", //Aditi
    "I Don't usually like leads but I like this lead🫂HBD Saaavi", //Poorva
    "Koi kahe, kehta rahe… kitna bhi humko deewana (Gill Paglu)", //Smruti
    "yedi...", //Yash
    "ERP Ki Dil, Happy Bday Mrs. Gill", //Shubman
    "I used to skip school to watch Saanvi play.", //Ronit
    "Seat Warriors Gang Leader", //Divyashree
    "o captain, my captain", //Manya
    "", //Soham
    "Waiting for the Day we meet - one captain to another", //Rohit Sharma
    "Happy Birthday to The Queen of Telecom ✨✨✨✨✨✨✨✨" //Group
  ];
  var TOTAL = messages.length;

  var icons = [
    '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="32" cy="24" rx="16" ry="19" fill="#c98a8a" opacity="0.85"/><path d="M32 43 L28 49 L36 49 Z" fill="#c98a8a" opacity="0.85"/><path d="M32 49 C 30 55, 34 58, 32 63" stroke="#cfc6ac" stroke-width="1.2" fill="none"/></svg>',
    '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="30" width="36" height="26" rx="2" fill="#d9b46a" opacity="0.85"/><rect x="14" y="22" width="36" height="10" rx="2" fill="#ecd08f" opacity="0.9"/><rect x="29" y="10" width="6" height="46" fill="#0a3324"/><path d="M32 10 C 28 4, 36 4, 32 10" stroke="#ecd08f" stroke-width="2" fill="none"/></svg>',
    '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 44 L32 12 L52 44 Z" fill="#123f2c" stroke="#d9b46a" stroke-width="1.5"/><circle cx="32" cy="20" r="2.4" fill="#ecd08f"/><circle cx="24" cy="34" r="2" fill="#c98a8a"/><circle cx="40" cy="34" r="2" fill="#c98a8a"/><rect x="12" y="44" width="40" height="4" fill="#d9b46a"/></svg>',
    '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="20" stroke="#d9b46a" stroke-width="1.4" fill="none"/><path d="M32 20 L34.5 28.5 L43 29 L36 34.5 L38.5 43 L32 37.5 L25.5 43 L28 34.5 L21 29 L29.5 28.5 Z" fill="#ecd08f" opacity="0.9"/></svg>',
    '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="32" height="26" rx="3" fill="#123f2c" stroke="#d9b46a" stroke-width="1.3"/><rect x="16" y="28" width="32" height="4" fill="#d9b46a"/><rect x="28" y="20" width="4" height="26" fill="#d9b46a"/><path d="M32 20 C 26 12, 22 16, 26 20 M32 20 C 38 12, 42 16, 38 20" stroke="#c98a8a" stroke-width="1.6" fill="none"/></svg>'
  ];

  /* ---------------- balloon field ---------------- */
  var balloonColors = ["#c98a8a","#d9b46a","#f4ecd8","#8fae95"];
  var field = document.getElementById('balloonField');
  var balloonCount = 7;
  for (var i=0;i<balloonCount;i++){
    var b = document.createElement('div');
    b.className = 'balloon';
    var left = Math.random()*94;
    var dur = 14 + Math.random()*10;
    var delay = Math.random()*-20;
    var scale = 0.7 + Math.random()*0.6;
    b.style.left = left+'%';
    b.style.animationDuration = dur+'s';
    b.style.animationDelay = delay+'s';
    b.style.transform = 'scale('+scale+')';
    var color = balloonColors[i % balloonColors.length];
    b.innerHTML =
      '<svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">' +
        '<path class="string" d="M30 70 C 26 76, 34 80, 30 90"></path>' +
        '<ellipse cx="30" cy="34" rx="24" ry="30" fill="'+color+'"></ellipse>' +
        '<ellipse cx="21" cy="22" rx="7" ry="10" fill="rgba(255,255,255,0.18)"></ellipse>' +
        '<path d="M30 64 L25 70 L35 70 Z" fill="'+color+'"></path>' +
      '</svg>';
    field.appendChild(b);
  }

  /* ---------------- panel switching ---------------- */
  var panels = {
    landing: document.getElementById('landing'),
    slideshow: document.getElementById('slideshow'),
    collage: document.getElementById('collage')
  };
  function show(name){
    Object.keys(panels).forEach(function(k){
      panels[k].classList.toggle('active', k===name);
    });
  }

  /* ---------------- slideshow ---------------- */
  var current = 0;
  var imgEl = document.getElementById('slide-img');
  var fallbackEl = document.getElementById('slide-fallback');
  var countEl = document.getElementById('slide-count');
  var msgEl = document.getElementById('slide-message');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var dotsWrap = document.getElementById('dots');

  for (var d=0; d<TOTAL; d++){
    var dot = document.createElement('div');
    dot.className = 'dot';
    dotsWrap.appendChild(dot);
  }

  function pad(n){ return n<10 ? '0'+n : ''+n; }

  function render(){
    var n = current+1;
    imgEl.style.display = '';
    imgEl.src = 'images/' + n + '.jpg';
    imgEl.alt = 'Photo ' + n;
    fallbackEl.style.display = 'none';
    fallbackEl.innerHTML = icons[current % icons.length] + '<span>Photo ' + n + ' of ' + TOTAL + '</span>';
    countEl.textContent = pad(n) + ' / ' + pad(TOTAL);
    msgEl.textContent = messages[current];
    prevBtn.disabled = current===0;
    var dotsEls = dotsWrap.querySelectorAll('.dot');
    dotsEls.forEach(function(el, idx){ el.classList.toggle('on', idx===current); });
  }

  prevBtn.addEventListener('click', function(){
    if (current>0){ current--; render(); }
  });
  nextBtn.addEventListener('click', function(){
    if (current < TOTAL-1){ current++; render(); }
    else { buildCollage(); show('collage'); }
  });

  document.getElementById('start-btn').addEventListener('click', function(){
    current = 0;
    render();
    show('slideshow');
  });

  document.addEventListener('keydown', function(e){
    if (!panels.slideshow.classList.contains('active')) return;
    if (e.key === 'ArrowRight') nextBtn.click();
    if (e.key === 'ArrowLeft') prevBtn.click();
  });

  /* ---------------- collage ---------------- */
  function buildCollage(){
    var grid = document.getElementById('collage-grid');
    grid.innerHTML = '';
    for (var i=1;i<=TOTAL;i++){
      var cell = document.createElement('div');
      cell.className = 'cell';
      var img = document.createElement('img');
      img.src = 'images/' + i + '.jpg';
      img.alt = 'Photo ' + i;
      img.onerror = function(){
        this.style.display='none';
        this.nextElementSibling.style.display='flex';
      };
      var fb = document.createElement('div');
      fb.className = 'fallback';
      fb.style.display = 'none';
      fb.innerHTML = icons[(i-1) % icons.length];
      cell.appendChild(img);
      cell.appendChild(fb);
      grid.appendChild(cell);
    }
  }

  document.getElementById('replay-btn').addEventListener('click', function(){
    show('landing');
  });

})();
</script>

</body>
</html>
